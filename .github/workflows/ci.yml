name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: for f in js/*.js data/questions.js scripts/*.js server/*.js; do node --check "$f"; done
      - name: Unit & API tests
        run: node --test
      - name: Frontend production build
        run: npm run build
