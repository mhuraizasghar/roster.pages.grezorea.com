<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Results | Roster</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-white">
  <nav class="navbar navbar-expand-md qh-nav sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
        <i class="fa-solid fa-graduation-cap me-2 text-primary"></i>Roster
      </a>
      <button class="navbar-toggler border-0 shadow-none p-1 no-print" type="button" data-bs-toggle="collapse" data-bs-target="#resultNavCollapse" aria-controls="resultNavCollapse" aria-expanded="false" aria-label="Toggle navigation">
        <i class="fa-solid fa-bars fs-5 text-secondary"></i>
      </button>
      <div class="collapse navbar-collapse no-print" id="resultNavCollapse">
        <div class="ms-md-auto d-flex flex-column flex-md-row gap-2 mt-2 mt-md-0">
          <button id="printBtn" class="btn btn-outline-secondary btn-sm d-none"><i class="fa-solid fa-print me-1"></i>Print Result</button>
          <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-house me-1"></i>Home</a>
          <a href="student.html" class="btn btn-primary btn-sm"><i class="fa-solid fa-graduation-cap me-1"></i>Student Portal</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div id="loading" class="text-center py-5">
      <div class="spinner-border spinner-border-sm text-primary" role="status"><span class="visually-hidden">Loading…</span></div>
    </div>

    <section id="messageView" class="d-none">
      <div class="card qh-card mx-auto shadow-sm" style="max-width: 520px;">
        <div class="card-body p-4 text-center">
          <div class="feature-icon mx-auto mb-3" style="width:3rem;height:3rem;"><i class="fa-solid fa-circle-info fa-lg"></i></div>
          <h1 class="h5" id="messageTitle"></h1>
          <p class="text-muted small" id="messageText"></p>
          <a href="student.html" class="btn btn-primary btn-sm"><i class="fa-solid fa-graduation-cap me-2"></i>Back to Student Portal</a>
        </div>
      </div>
    </section>

    <section id="resultView" class="d-none">
      
      <div class="card qh-card mb-4 shadow-sm">
        <div class="card-body p-4">
          <div class="row g-4 align-items-center">
            <div class="col-md-auto d-flex justify-content-center">
              <div class="score-ring" id="ring"><div>
                <span class="display-6 fw-bold lh-1" id="ringPct"></span>
                <span class="small text-muted" id="ringScore"></span>
              </div></div>
            </div>
            <div class="col-md">
              <span id="passBadge" class="badge mb-2"></span>
              <h1 class="h4 mb-1" id="resultHeadline"></h1>
              <p class="text-muted small mb-3" id="resultSub"></p>
              <div class="row g-2">
                <div class="col-6 col-lg-3"><div class="stat-tile"><div class="num text-success" id="statCorrect"></div><div class="small text-muted">Correct</div></div></div>
                <div class="col-6 col-lg-3"><div class="stat-tile"><div class="num text-danger" id="statWrong"></div><div class="small text-muted">Incorrect</div></div></div>
                <div class="col-6 col-lg-3"><div class="stat-tile"><div class="num" style="color:var(--qh-warn)" id="statSkipped"></div><div class="small text-muted">Skipped</div></div></div>
                <div class="col-6 col-lg-3"><div class="stat-tile"><div class="num" id="statTime"></div><div class="small text-muted">Time taken</div></div></div>
              </div>
            </div>
          </div>
        </div>
        <div class="card-footer bg-transparent d-flex flex-wrap gap-2 p-3 no-print">
          <a id="retakeBtn" class="btn btn-primary btn-sm"><i class="fa-solid fa-rotate-right me-2"></i>Try again</a>
          <a href="student.html" class="btn btn-outline-secondary btn-sm">All quizzes</a>
          <span id="autoNote" class="ms-auto small text-muted align-self-center d-none"><i class="fa-regular fa-hourglass-half me-1"></i>Submitted automatically when time ran out</span>
        </div>
      </div>

      <div class="row g-4">
        
        <div class="col-lg-8">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h2 class="h5 mb-0">Answer review</h2>
            <div class="btn-group btn-group-sm no-print" role="group" aria-label="Filter questions" id="filters">
              <button type="button" class="btn btn-outline-primary active" data-filter="all">All</button>
              <button type="button" class="btn btn-outline-primary" data-filter="correct">Correct</button>
              <button type="button" class="btn btn-outline-primary" data-filter="wrong">Incorrect</button>
              <button type="button" class="btn btn-outline-primary" data-filter="skipped">Skipped</button>
            </div>
          </div>
          <div id="reviewList" class="d-grid gap-3"></div>
        </div>

        
        <div class="col-lg-4">
          <div class="card qh-card position-sticky" style="top: 5rem;">
            <div class="card-header"><i class="fa-solid fa-trophy me-2 text-warning"></i>High scores<span class="small text-muted fw-normal ms-2" id="lbQuizName"></span></div>
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead><tr><th class="text-center">#</th><th>Student</th><th class="text-end">Score</th><th class="text-end">Time</th></tr></thead>
                <tbody id="lbBody"></tbody>
              </table>
            </div>
            <div class="card-footer bg-transparent small text-muted" id="rankNote"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="data/questions.js"></script>
  <script src="js/store.js"></script>
  <script src="js/result.js"></script>
</body>
</html>
